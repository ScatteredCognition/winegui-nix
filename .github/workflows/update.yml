name: update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Bump WineGUI to the latest upstream tag
        # --flake ignores passthru.updateScript, so the tag prefix must be given here too
        run: nix run nixpkgs#nix-update -- flake winegui --version-regex 'v([0-9]+\.[0-9]+\.[0-9]+.*)'

      - name: Refresh flake inputs
        run: nix flake update

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update/winegui
          commit-message: "winegui: update to latest upstream"
          title: "winegui: update to latest upstream"
          body: |
            Automated version bump produced by `nix-update` plus a `nix flake update`.

            CI builds `.#winegui` and `.#winegui-fhs` before this is merged.
